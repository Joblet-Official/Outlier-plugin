<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scale AI Jobs</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    :root {
      --ink:        #0A0A0A;   /* primary text / action */
      --ink-2:      #3F3F46;   /* secondary text */
      --ink-3:      #71717A;   /* muted / meta */
      --ink-4:      #A1A1AA;   /* subtle */
      --card:       #FFFFFF;
      --card-2:     #F4F4F5;   /* employer tile / skeleton */
      --line:       #E7E7EA;   /* hairline border */
      --line-strong:#D4D4D8;
      --head-ink:   #0A0A0A;
      --head-muted: #71717A;
    }

    @media (prefers-color-scheme: dark) {
      :root { --head-ink: #FAFAFA; --head-muted: #A1A1AA; }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: transparent;
      color: var(--ink);
      padding: 14px 12px 4px;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* ---------- Header ---------- */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin-bottom: 18px; padding: 0 6px;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand img { height: 26px; width: auto; display: block; }
    .brand .wordmark {
      font-size: 18px; font-weight: 700; letter-spacing: -0.4px;
      color: var(--head-ink); line-height: 1;
    }
    .result-count {
      font-size: 12.5px; font-weight: 500; color: var(--head-muted);
      white-space: nowrap;
    }

    /* ---------- Carousel ---------- */
    .carousel {
      display: flex; overflow-x: auto; gap: 14px; padding: 4px 6px 20px;
      scroll-snap-type: x mandatory;
      scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent;
    }
    .carousel::-webkit-scrollbar { height: 5px; }
    .carousel::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 10px; }

    /* ---------- Card ---------- */
    .job-card {
      min-width: 282px; max-width: 282px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px; padding: 18px;
      scroll-snap-align: start;
      display: flex; flex-direction: column; gap: 12px;
      box-shadow: 0 1px 2px rgba(9,9,11,0.04);
      transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease;
      cursor: pointer;
    }
    .job-card:hover {
      transform: translateY(-2px);
      border-color: var(--line-strong);
      box-shadow: 0 10px 26px rgba(9,9,11,0.10);
    }

    .card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .employer { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .employer-logo {
      width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
      background: var(--card-2); color: var(--ink-2);
      display: grid; place-items: center; font-weight: 700; font-size: 13px;
      letter-spacing: -0.3px;
    }
    .employer-name {
      font-size: 13px; font-weight: 500; color: var(--ink-3);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .type-chip {
      font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px;
      color: var(--ink-3);
      background: transparent;
      border: 1px solid var(--line-strong);
      padding: 3px 8px; border-radius: 6px;
      white-space: nowrap; flex-shrink: 0;
    }

    .job-title {
      font-size: 16.5px; font-weight: 700; line-height: 1.3; color: var(--ink);
      letter-spacing: -0.35px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      min-height: 43px;
    }

    .meta-row {
      display: flex; align-items: center; gap: 7px;
      font-size: 13px; font-weight: 500; color: var(--ink-3);
    }
    .meta-row svg { width: 14px; height: 14px; flex-shrink: 0; color: var(--ink-4); }
    .meta-row span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meta-row.salary { color: var(--ink-2); font-weight: 600; }

    .job-summary {
      font-size: 12.5px; line-height: 1.5; color: var(--ink-3);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }

    .divider { height: 1px; background: var(--line); margin: 2px 0 0; }

    .apply-btn {
      display: flex; align-items: center; justify-content: center; gap: 7px; text-align: center;
      background: var(--ink); color: #fff;
      border: none; text-decoration: none;
      font-weight: 600; font-size: 13.5px; letter-spacing: .1px;
      padding: 11px; border-radius: 9px; margin-top: 4px;
      transition: background .18s ease;
    }
    .apply-btn .arrow { transition: transform .2s cubic-bezier(.16,1,.3,1); font-size: 15px; line-height: 1; }
    .job-card:hover .apply-btn { background: #000; }
    .job-card:hover .apply-btn .arrow { transform: translateX(3px); }
    .apply-btn:active { opacity: .9; }

    /* ---------- Loading skeleton ---------- */
    .skeleton-wrap { display: flex; gap: 14px; padding: 4px 6px 20px; overflow: hidden; }
    .skel-card {
      min-width: 282px; max-width: 282px; height: 244px;
      border-radius: 14px; padding: 18px;
      background: var(--card); border: 1px solid var(--line);
      display: flex; flex-direction: column; gap: 12px;
    }
    .skel { border-radius: 6px; background: var(--card-2);
      background-image: linear-gradient(90deg, transparent, rgba(0,0,0,0.035), transparent);
      background-size: 200% 100%; background-repeat: no-repeat;
      animation: shimmer 1.5s infinite; }
    @keyframes shimmer { to { background-position: -200% 0; } }
    .skel.logo { width: 30px; height: 30px; border-radius: 8px; }
    .skel.line { height: 13px; }
    .skel.w85 { width: 85%; } .skel.w65 { width: 65%; } .skel.w45 { width: 45%; }
    .skel.btn { height: 40px; border-radius: 9px; margin-top: auto; }

    .empty-state {
      text-align: center; padding: 52px 20px; color: var(--head-muted); font-size: 14px; font-weight: 500;
      border: 1px solid var(--line); border-radius: 14px; background: var(--card);
    }
    .empty-state .emoji { font-size: 26px; display: block; margin-bottom: 10px; opacity: .8; }
  </style>
</head>
<body>
  <div id="root">
    <div class="skeleton-wrap">
      <div class="skel-card">
        <div class="skel logo"></div>
        <div class="skel line w85"></div><div class="skel line w65"></div><div class="skel line w45"></div>
        <div class="skel btn"></div>
      </div>
      <div class="skel-card">
        <div class="skel logo"></div>
        <div class="skel line w85"></div><div class="skel line w65"></div><div class="skel line w45"></div>
        <div class="skel btn"></div>
      </div>
      <div class="skel-card">
        <div class="skel logo"></div>
        <div class="skel line w85"></div><div class="skel line w65"></div><div class="skel line w45"></div>
        <div class="skel btn"></div>
      </div>
    </div>
  </div>

  <script type="module">
    const root = document.getElementById('root');
    const SCALE_LOGO = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEEAAABVCAYAAAAWsInIAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAAEnQAABJ0Ad5mH3gAAA2USURBVHhe7VvLbxvVHv7mPfbEduzYsWM5cZw3hEI3pQgWCRIVUqusbjcghNjDlu29d4UE/wU7BCskJCRggRAgEIhuUCFEbZM2cRIncfwYz/txFzPnZOw6zaO0VLf+JCv2eGzP7zvf7zknjO/7Pp5ysL0HnkYMSBiQEGBAwoCEAAMSBiQEGJAwICHAgIQBCQEGJAxICDAgYUBCAOYs8wTbceA4LjzPxxk+9kjAMAxYlgHPcxB4vvftM+FUJNiOA8tywh/lwXMsGIbpPe2xwvd9OK4Hx3HgeT5EkT83GSeSYJo2PM+DKArguCfTe1zXg2XZYFkWkiT0vn0iHkiCadrQdA3ffP0VNjY24LpulwIYhqGve4/3/o0+WDZQUvQ5y7LgOA4Mw4DjuK7jBJ7nwXVdmKaJTqcDXddhmiYYhoGu6/j3f/4Lljk7EceSYDsOHNsFz7OoVqv4/vvvcXBwEMQCBmBwZBR6DD3OyN7n0QcYgGWO3Mz3fWq0bdtwXZcarWkaNE0DwzAYGhqCqqpYX1/Hxx9/DF03wQtnixPHktDRDMiSCJZl4Hkednd38cMPP6DT6dBzooYdZxxZ3V4SEFGK53mBjzsOPM+DbduwLAuO48AwDJimGay+2oFpmXBdF4qiIJFIwHVdrK6uYmtrC1988QVc14NhWlDiMr3Ok9CXBJIFYrJEj3meh1qthrt37+Lg4OBYo3uJIYaS7/B9H14Y0BzXgW3bwXPHgWmasG0btm0HxlsmtI4GXddhWRYYhoEsy0in00ilUrAsC3/++SfW19ehqiq+/vprAIBumGfKGn1JCL6Eh8BzXccdx0Gz2cTm5iYsywJCNURlH5UzIn7seYHhRN5kpS3LokQYpgHHDlZf0zWYhgnd0OE6LliWRSqVQjKZRCqVguM42N/fx82bN1Gr1eA4Dr766isAgO24cBynaxEfhL4kdDQD8ZjUtYoEvu9D0zS0Wi1YlkVXl/gwMZpIO2qkaZpwnGD1e0kwTTMw3DRh6IELeJ4HjuOgKApSqRRGRkYgiiIcx0G1WsXW1hY27m6go3bAcRy+/PLLo2vUzVO7RN+c5/t+XwIQ+nE8HsfIyAhSqRREUaQ+TlbZNE3ouo5Op0Mfqqre91pVVTSbTdTrddTrdRzWD9FsNKFpGnzPhyiKyOVyKBaLKBQKUBQFDMOg3W6jVquhXq/DNI7Iil5jn7U9Fn1JOAkMw0AQBHpRJJiZpgnDMKDr+n2P6HFN06CqKtrtNlqtFtrtNlRVhWEYcBwHHMchkUggm81idHQU6XQasVgMAGCaJlqtFprNJnRdp2mbP6X/90Nfd1A7OoaU4EdPgmEYqFarODw8hK7rVOq9cifBzrIsSgY513VdAADP85AkCel0GiMjI4jH44jH42BZFq7rUtVsbGxgc3MTnU4HhmGA53kkEgl89tln9LrOYsO5lBCFJEnIZrMQBIGusqYFEV3TNCp9surNZhOqqkLTAv8nKymKIlKpFHK5HHLZHFKpFBRFAc/z8PxAaaqqotFooN1ud5HHhAXWefHQJADA0NAQyuUyGIa5Lx5EjW+1WpQA2w7KceJW6XQahUIhkH8mDUVRIIoiGIaBYzvQDR2tVguNRgOaptHACwAcxz2UOzw0CSQ9JhIJLC4uIp1Oo91u02BXP6ij0Wig1WrR1fd9H4Ig0ABbLBZRKpWo/8fjcWqUZVnQNA3NRhP7+/s0FhASWJYNmrp/kgQClmWRy+UwMzMDSZKoK+hGUOo6jgPf98GyLAQxICCZTCKTySCdTiOZTCIej0OSpEDaflBjWHYQQ4iCSPAkKiCu8I+7AwHHcSgWi3jllVeQTCa76g O2bRi6QdthhFklOkw9DYhrvP3220gmk1RJURIeS0zgOA75fB5zc3OIx+Mol8t48cUXsbCwAE3TUK1WIQjBFhlJkjA3N4disQgnvJVvGAYQ9iFkpHZakKxRqVTw7rvv4vnnn6cNE2niHrkSCDiOw8WLF/Haa69hfHycypr0B2RGgHDF5+bmMDk5SSs/lmUhCELXXeyzolwu48qVKyiVSlRRj8UdCEgmmJ6exuzsLGRZhmma2N/fh+/79K4xgaIouHz5Mi5cuIChoSHa9MiyfC4SiCImJibw+uuvY2xsrGtQ+zDo+2nmAff3eZ5HpVLB1NQUPM9Du92GJEn3kcCEdcQbb7yBlZUV2u3JsnymmNALnudpZTk/P08VEVWC/4D9Ff3QlwSWZeC4R/V9LziOoxUiyR7H+TlRxKuvvkonQGe5wH5gWRZjY2N49tlnkU6nqVsQOK4H9gy9RF8SeJ6DE946Ow6yLOPCcxfw5ptvYnx8nAbGXjAMg0wmg2vXrmFpaQnDw8MPLV+E9zWKxSKWlpZQKBS6ft9xHPA9+60ehL5DFUS28J20i9UwDOzt7cG2bUxNTfW+TeGHe50ODw8hyzKy2WzvKeeC67qoVqv4+eefcf369b9vCx8imzljsZN3gJHRWDwe732rC6RF9sNb838H/PB+xd7eHorF4t+7mRNkX7PvnXor3D8N3TD/3m29BE/9Bm+Cp36rfxRP9T99/L/jyXTyx4wBCQMSAgxIGJAQYEDCgIQAAxIGJAQYkDAgIcCAhAEJAQYkDEgIMCBhQEKAAQkA/gfwWXbeuvQ1PQAAAABJRU5ErkJggg==";
    let dataReceived = false;

    setTimeout(() => { if (!dataReceived) root.innerHTML = ''; }, 3500);

    const SVGNS = 'http://www.w3.org/2000/svg';
    function icon(paths) {
      const s = document.createElementNS(SVGNS, 'svg');
      s.setAttribute('viewBox', '0 0 24 24');
      s.setAttribute('fill', 'none');
      s.innerHTML = paths;
      return s;
    }
    const ICON_PIN = '<path d="M12 21s-6-5.686-6-10a6 6 0 1 1 12 0c0 4.314-6 10-6 10Z" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="11" r="2.1" stroke="currentColor" stroke-width="1.6"/>';
    const ICON_CASH = '<path d="M4 7h16M4 7v10a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V7M4 7l1.5-3h13L20 7" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="12.5" r="2.2" stroke="currentColor" stroke-width="1.6"/>';

    function metaRow(paths, text, extraClass) {
      const row = document.createElement('div');
      row.className = 'meta-row' + (extraClass ? ' ' + extraClass : '');
      row.appendChild(icon(paths));
      const sp = document.createElement('span');
      sp.textContent = text;
      row.appendChild(sp);
      return row;
    }

    function openUrl(safeUrl) {
      if (window.openai && window.openai.openExternal) {
        window.openai.openExternal({ href: safeUrl, redirectUrl: false });
      } else {
        window.open(safeUrl, '_blank', 'noopener,noreferrer');
      }
    }

    function renderJobs(payload) {
      dataReceived = true;
      const data = payload && payload.type && payload.data ? payload.data : payload;
      if (!data || !data.jobs) { root.innerHTML = ''; return; }
      if (data.jobs.length === 0) {
        root.innerHTML = '<div class="empty-state"><span class="emoji">🔍</span>No matching roles found.<br>Try a different search.</div>';
        return;
      }

      root.innerHTML = '';

      // Header
      const header = document.createElement('div');
      header.className = 'header';
      const brand = document.createElement('div');
      brand.className = 'brand';
      if (SCALE_LOGO && SCALE_LOGO.indexOf('data:') === 0) {
        const img = document.createElement('img');
        img.src = SCALE_LOGO; img.alt = 'Scale AI';
        brand.appendChild(img);
      }
      const wordmark = document.createElement('span');
      wordmark.className = 'wordmark';
      wordmark.textContent = 'Scale AI';
      brand.appendChild(wordmark);
      header.appendChild(brand);

      const resultCount = document.createElement('div');
      resultCount.className = 'result-count';
      const n = (data.totalResults ?? data.jobs.length);
      resultCount.textContent = n + (n === 1 ? ' open role' : ' open roles');
      header.appendChild(resultCount);
      root.appendChild(header);

      // Carousel
      const carousel = document.createElement('div');
      carousel.className = 'carousel';

      data.jobs.forEach(job => {
        const company = job.employer || 'Scale AI';
        const initialStr = (company.trim()[0] || 'S').toUpperCase();
        const safeUrl = String(job.applicationUrl || '#');

        const card = document.createElement('div');
        card.className = 'job-card';
        card.addEventListener('click', (e) => {
          if (!e.target.closest('.apply-btn')) openUrl(safeUrl);
        });

        const cardTop = document.createElement('div');
        cardTop.className = 'card-top';
        const employerDiv = document.createElement('div');
        employerDiv.className = 'employer';
        const logoDiv = document.createElement('div');
        logoDiv.className = 'employer-logo';
        logoDiv.textContent = initialStr;
        const nameSpan = document.createElement('span');
        nameSpan.className = 'employer-name';
        nameSpan.textContent = company;
        employerDiv.appendChild(logoDiv);
        employerDiv.appendChild(nameSpan);
        cardTop.appendChild(employerDiv);

        const typeText = job.schedule || job.contractType;
        if (typeText) {
          const typeChip = document.createElement('span');
          typeChip.className = 'type-chip';
          typeChip.textContent = typeText;
          cardTop.appendChild(typeChip);
        }
        card.appendChild(cardTop);

        const titleDiv = document.createElement('div');
        titleDiv.className = 'job-title';
        titleDiv.textContent = job.title || 'Open Position';
        card.appendChild(titleDiv);

        if (job.location) card.appendChild(metaRow(ICON_PIN, job.location));
        if (job.salary) card.appendChild(metaRow(ICON_CASH, job.salary, 'salary'));

        if (job.summary) {
          const sumDiv = document.createElement('div');
          sumDiv.className = 'job-summary';
          sumDiv.textContent = job.summary;
          card.appendChild(sumDiv);
        }

        const divider = document.createElement('div');
        divider.className = 'divider';
        card.appendChild(divider);

        const applyBtn = document.createElement('a');
        applyBtn.className = 'apply-btn';
        applyBtn.href = safeUrl;
        const btnLabel = document.createElement('span');
        btnLabel.textContent = 'View role';
        const arrow = document.createElement('span');
        arrow.className = 'arrow';
        arrow.textContent = '→';
        applyBtn.appendChild(btnLabel);
        applyBtn.appendChild(arrow);
        applyBtn.addEventListener('click', (e) => { e.preventDefault(); openUrl(safeUrl); });
        card.appendChild(applyBtn);

        carousel.appendChild(card);
      });

      root.appendChild(carousel);
    }

    window.addEventListener('openai:set_globals', (event) => {
      const globals = event.detail?.globals;
      if (globals?.toolOutput) renderJobs(globals.toolOutput);
    });
    if (window.openai?.toolOutput) renderJobs(window.openai.toolOutput);
    if (window.openai?.onToolOutput) window.openai.onToolOutput((data) => renderJobs(data));
  </script>
</body>
</html>
